name: Versioned binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build (for example v0.3.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: binaries-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the requested version tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate tag, manifest version, and checked-out commit
        run: python tools/release.py --tag "$RELEASE_TAG"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.99.0'
          targets: ${{ matrix.target }}
      - name: Build CPU binary without CUDA
        run: cargo build --release --locked --target "${{ matrix.target }}" --bin charart
      - name: Test library and documentation
        run: cargo test --locked --target "${{ matrix.target }}"
      - name: Package binary, checksums, and dependency licenses
        run: python tools/release.py --tag "$RELEASE_TAG" --target "${{ matrix.target }}"
      - name: Store versioned binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: charart-${{ env.RELEASE_TAG }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
